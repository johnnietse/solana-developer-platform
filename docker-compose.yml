services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdp
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp
    ports:
      - "${SDP_POSTGRES_PORT:-5433}:5432"
    volumes:
      - sdp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdp -d sdp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${SDP_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  sdp-migrate:
    build:
      context: .
      dockerfile: apps/sdp-api/Dockerfile
      target: builder
    working_dir: /repo/apps/sdp-api
    command: ["node", "scripts/migrate-postgres.mjs"]
    environment:
      DATABASE_URL: postgresql://sdp:sdp@postgres:5432/sdp
    depends_on:
      postgres:
        condition: service_healthy

  sdp-api:
    build:
      context: .
      dockerfile: apps/sdp-api/Dockerfile
    restart: unless-stopped
    ports:
      - "${SDP_API_PORT:-8787}:8787"
    environment:
      # Core
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_VERSION: ${API_VERSION:-local-compose}
      SDP_RUNTIME: node
      SDP_DEPLOYMENT_MODE: ${SDP_DEPLOYMENT_MODE:-self_hosted}
      DATABASE_URL: postgresql://sdp:sdp@postgres:5432/sdp
      REDIS_URL: redis://redis:6379

      # Clerk authentication
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}

      # App secrets
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      CUSTODY_ENCRYPTION_KEY: ${CUSTODY_ENCRYPTION_KEY:-}
      # Enables the "local" custody provider (base58 64-byte Solana keypair).
      CUSTODY_PRIVATE_KEY: ${CUSTODY_PRIVATE_KEY:-}

      # Solana
      SOLANA_NETWORK: ${SOLANA_NETWORK:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}

      # Signing
      SIGNING_PROVIDER: ${SIGNING_PROVIDER:-local}
      FEE_PAYER_PRIVATE_KEY: ${FEE_PAYER_PRIVATE_KEY:-}
      FEE_PAYMENT_PROVIDER: ${FEE_PAYMENT_PROVIDER:-native}
      # Where the Kora fee sponsor listens. env.d.ts has always declared this,
      # but compose never passed it, so selecting FEE_PAYMENT_PROVIDER=kora
      # gave an adapter with nowhere to send a request. Empty by default, which
      # keeps the native path unchanged.
      #
      # For a Surfpool run this points at WSL through the Windows host:
      # the container cannot reach WSL's 172.x address directly, but
      # host.docker.internal plus WSL2 localhost forwarding does resolve.
      # scripts/wire-surfpool.sh writes the value.
      KORA_RPC_URL: ${KORA_RPC_URL:-}

      # Databricks — backs GET /v1/data-products/analytics. All three must be
      # set or the route answers 503 "Databricks credentials not configured".
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}
      DATABRICKS_CATALOG: ${DATABRICKS_CATALOG:-workspace}
      DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA:-default}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      ANALYTICS_MINTS: ${ANALYTICS_MINTS:-}

      # Observability (optional)
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sdp-migrate:
        condition: service_completed_successfully

  sdp-metrics-api:
    build:
      context: ./apps/sdp-metrics-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SDP_METRICS_API_PORT:-8080}:8080"
    environment:
      # Credentials come from the mounted profile below rather than env vars.
      # Without them the Delta cache misses on every call and /rpc still
      # answers, from live RPC - correct, but far slower and rate-limited.
      AWS_PROFILE: ${AWS_PROFILE:-sdp-user}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      S3_INSERT_BUCKET: ${S3_INSERT_BUCKET:-tmp-sdp-data}
      RPC_TABLE_NAME: ${RPC_TABLE_NAME:-dev.mlh.rpc_counts}
      RPC_CACHE_TTL_SECONDS: ${RPC_CACHE_TTL_SECONDS:-3600}
    volumes:
      - "${USERPROFILE:-${HOME}}/.aws:/root/.aws:ro"

  sdp-web:
    build:
      context: .
      dockerfile: apps/sdp-web/Dockerfile
      args:
        NEXT_PUBLIC_SDP_API_BASE_URL: ${NEXT_PUBLIC_SDP_API_BASE_URL:-http://localhost:8787}
        NEXT_PUBLIC_SDP_DOCS_URL: ${NEXT_PUBLIC_SDP_DOCS_URL:-http://localhost:3001}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "${SDP_WEB_PORT:-3000}:3000"
    environment:
      SDP_API_BASE_URL: http://sdp-api:8787
      METRICS_API_BASE_URL: http://sdp-metrics-api:8080
      # Read by app/api/polars/[[...path]]/route.ts. Service DNS, not
      # localhost: inside this container 127.0.0.1 is the container itself, so
      # the route's default would connect to nothing and every panel that uses
      # it would show a connection error while the service sat healthy.
      POLARS_API_BASE_URL: http://sdp-polars-api:8080
      # The ECS deployment. The proxy sends the four routes that service
      # actually implements here, and anything under /deployed/ unconditionally,
      # so the dashboard can prove the deployed container works rather than
      # inferring it from a panel the local service might have answered.
      POLARS_RPC_API_BASE_URL: ${POLARS_RPC_API_BASE_URL:-http://35.171.121.207:8080}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_JWT_TEMPLATE: ${CLERK_JWT_TEMPLATE:-sdp-api}
    depends_on:
      sdp-api:
        condition: service_healthy
      sdp-metrics-api:
        condition: service_started

  sdp-docs:
    build:
      context: .
      dockerfile: apps/sdp-docs/Dockerfile
      args:
        NEXT_PUBLIC_SDP_WEB_URL: ${NEXT_PUBLIC_SDP_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_SDP_DOCS_URL: ${NEXT_PUBLIC_SDP_DOCS_URL:-http://localhost:3001}
        NEXT_PUBLIC_SDP_API_URL: ${NEXT_PUBLIC_SDP_API_URL:-http://localhost:8787}
    restart: unless-stopped
    ports:
      - "${SDP_DOCS_PORT:-3001}:3001"

  # The Polars service. Distinct from sdp-metrics-api above: this one serves
  # /stablecoins, /network, /tokens, /holders and the metric catalog, which
  # sdp-metrics-api has never implemented. Both are needed at once.
  sdp-polars-api:
    build:
      context: ./sdp-polars-api
    restart: unless-stopped
    ports:
      - "${SDP_POLARS_API_PORT:-8081}:8080"
    environment:
      # S3, for the Delta tables Databricks writes and Polars reads back
      S3_BUCKET: ${S3_BUCKET:-tmp-sdp-data}
      S3_REGION: ${AWS_REGION:-us-east-1}
      # Credentials come from the mounted profile below, not from env vars, so
      # no key material is written into this file, the shell history or an
      # image layer. Static keys still win if both are set, which is what CI
      # uses; on ECS the task role replaces both. Blank env vars were the old
      # default and gave the worst outcome available: every Delta read failed
      # and the routes answered 200 with zero rows.
      AWS_PROFILE: ${AWS_PROFILE:-sdp-user}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      # The public devnet endpoint throttles this service's ingestion cycle:
      # getLargestAccounts and getTokenLargestAccounts are 429'd on every run,
      # so whales and holders fall back to a slower proxy path. config.py reads
      # both of these and ingestion.py already rotates through them in order,
      # but compose never passed them, so the rotation pool was always empty
      # and "trying next endpoint" had nowhere to go. Set either in .env to a
      # keyed endpoint and the 429s stop.
      SOLANA_RPC_FALLBACK_URL: ${SOLANA_RPC_FALLBACK_URL:-}
      SOLANA_RPC_URLS: ${SOLANA_RPC_URLS:-}
      INGESTION_INTERVAL_MINUTES: ${INGESTION_INTERVAL_MINUTES:-15}
      # Databricks bridge, optional
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_WAREHOUSE_ID: ${DATABRICKS_WAREHOUSE_ID:-}
    volumes:
      # Read-only so a compromised container cannot rewrite the credentials.
      - "${USERPROFILE:-${HOME}}/.aws:/root/.aws:ro"
    # The image declares no HEALTHCHECK, so define one here; curl is installed
    # by the Dockerfile. /health is used rather than a data route because it
    # never touches S3 and so cannot flap on Delta table availability.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  sdp-postgres-data:
